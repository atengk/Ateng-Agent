<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 渐变色定义 -->
    <linearGradient id="aiHeroGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="aiHeroGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="aiHeroGradWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="centralAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#9333ea" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 辉光滤镜 -->
    <filter id="heroGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景辐射光晕 -->
  <circle cx="400" cy="400" r="380" fill="url(#centralAura)" />

  <!-- 外围科技轨道环与刻度 -->
  <g opacity="0.35">
    <circle cx="400" cy="400" r="320" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 12" />
    <circle cx="400" cy="400" r="260" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="400" cy="400" r="200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="16 8" />
  </g>

  <!-- 动态多智能体协作轨道 (椭圆倾角) -->
  <g opacity="0.65" transform="rotate(-25 400 400)">
    <ellipse cx="400" cy="400" rx="340" ry="140" fill="none" stroke="url(#aiHeroGradPrimary)" stroke-width="2" stroke-dasharray="12 16" />
  </g>
  <g opacity="0.6" transform="rotate(35 400 400)">
    <ellipse cx="400" cy="400" rx="330" ry="130" fill="none" stroke="url(#aiHeroGradAccent)" stroke-width="2" stroke-dasharray="16 12" />
  </g>

  <!-- 神经拓扑连接线束与数据流通路径 -->
  <g stroke="url(#aiHeroGradPrimary)" stroke-width="2" opacity="0.75" filter="url(#softGlow)">
    <!-- 核心到卫星节点的连线 -->
    <path d="M400 400 L210 240" stroke-dasharray="6 4" />
    <path d="M400 400 L590 220" stroke-dasharray="6 4" />
    <path d="M400 400 L620 540" stroke-dasharray="6 4" />
    <path d="M400 400 L230 560" stroke-dasharray="6 4" />
    <path d="M400 400 L400 160" stroke-dasharray="4 4" />
    <path d="M400 400 L400 640" stroke-dasharray="4 4" />
    <!-- 卫星节点间的互联编排线 -->
    <path d="M210 240 L400 160 L590 220 L620 540 L400 640 L230 560 Z" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
  </g>

  <!-- 核心 AI 智能体大脑与决策枢纽 (Central Autonomous Core) -->
  <!-- 能量基底环 -->
  <circle cx="400" cy="400" r="110" fill="url(#coreGlowGrad)" filter="url(#heroGlow)" />
  <circle cx="400" cy="400" r="90" fill="#0f172a" stroke="url(#aiHeroGradPrimary)" stroke-width="3" />
  
  <!-- 核心六边形与芯片级微架构 -->
  <polygon points="400,335 456,367 456,433 400,465 344,433 344,367" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2.5" />
  <polygon points="400,350 443,375 443,425 400,450 357,425 357,375" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- 核心晶体图形: 科技感 "A" 结合 Agent 智能体节点 -->
  <g filter="url(#heroGlow)">
    <path d="M400 365 L372 430" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <path d="M400 365 L428 430" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <path d="M380 412 L420 412" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="400" cy="365" r="7" fill="#f43f5e" />
  </g>

  <!-- 卫星节点 1: Skills 技能库生态 (左上方) -->
  <g transform="translate(210, 240)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="34" fill="#1e293b" opacity="0.8" />
    <!-- 技能扳手/工具图腾 -->
    <path d="M-10 -10 L10 10 M-6 -14 A10 10 0 0 1 14 6 L8 12 L-4 0 L-12 8 L-14 6 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- 卫星节点 2: MCP 统一协议连接器 (右上方) -->
  <g transform="translate(590, 220)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="0" cy="0" r="36" fill="#1e293b" opacity="0.8" />
    <!-- MCP 协议插头/节点矩阵 -->
    <rect x="-14" y="-8" width="28" height="16" rx="4" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <line x1="-8" y1="-14" x2="-8" y2="-8" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="-14" x2="8" y2="-8" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="8" x2="0" y2="16" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#c084fc" />
  </g>

  <!-- 卫星节点 3: LLM 本地大模型推理基座 (右下方) -->
  <g transform="translate(620, 540)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#ec4899" stroke-width="2.5" />
    <circle cx="0" cy="0" r="34" fill="#1e293b" opacity="0.8" />
    <!-- 神经网络突触 / 智能算力晶片 -->
    <circle cx="-10" cy="-6" r="4" fill="#f472b6" />
    <circle cx="10" cy="-6" r="4" fill="#f472b6" />
    <circle cx="0" cy="10" r="4" fill="#f472b6" />
    <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#f472b6" stroke-width="2" />
    <line x1="-10" y1="-6" x2="0" y2="10" stroke="#f472b6" stroke-width="2" />
    <line x1="10" y1="-6" x2="0" y2="10" stroke="#f472b6" stroke-width="2" />
  </g>

  <!-- 卫星节点 4: RAG 向量知识库检索 (左下方) -->
  <g transform="translate(230, 560)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <circle cx="0" cy="0" r="34" fill="#1e293b" opacity="0.8" />
    <!-- 多维向量检索知识层叠 -->
    <path d="M-12 -8 L0 -14 L12 -8 L0 -2 Z" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" />
    <path d="M-12 0 L0 -6 L12 0 L0 6 Z" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" />
    <path d="M-12 8 L0 2 L12 8 L0 14 Z" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- 卫星节点 5: 顶部自主编排调度器 (Top Orchestrator) -->
  <g transform="translate(400, 160)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
    <polygon points="0,-12 10,6 -10,6" fill="url(#aiHeroGradPrimary)" />
  </g>

  <!-- 卫星节点 6: 底部质量核验与 Eval 门禁 (Bottom Evaluation Gate) -->
  <g transform="translate(400, 640)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <path d="M-8 0 L-2 6 L8 -4" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 悬浮微粒与科技光斑 (Cyber Dust & Sparks) -->
  <circle cx="310" cy="180" r="3" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="510" cy="170" r="2.5" fill="#818cf8" filter="url(#softGlow)" />
  <circle cx="160" cy="380" r="3.5" fill="#a78bfa" filter="url(#softGlow)" />
  <circle cx="670" cy="370" r="3" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="300" cy="620" r="2.5" fill="#34d399" filter="url(#softGlow)" />
  <circle cx="530" cy="630" r="3.5" fill="#f472b6" filter="url(#softGlow)" />

  <!-- 浮动多智能体微标牌 (Floating Badges) -->
  <g transform="translate(490, 310)" opacity="0.9">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="43" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="0.5">AGENTIC</text>
  </g>
  <g transform="translate(230, 440)" opacity="0.9">
    <rect x="0" y="0" width="76" height="24" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
    <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="0.5">MCP/SDD</text>
  </g>
</svg>
